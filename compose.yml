services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fitqueue
      POSTGRES_USER: fitqueue
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: